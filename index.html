<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ye Olde Stack Trace 🏴‍☠️⚔️</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif; 
            background: #120e0b; 
            color: #f4e8c1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #231a12; 
            padding: 2.5rem; 
            border-radius: 12px; 
            max-width: 650px; 
            width: 100%; 
            border: 2px solid #8b5a2b; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        h1 { 
            color: #d4af37; 
            text-align: center; 
            margin-top: 0; 
            font-size: 2.2rem; 
            text-shadow: 2px 2px #000; 
        }
        p { text-align: center; color: #c0a980; margin-bottom: 20px; line-height: 1.5; }
        label { font-size: 0.9rem; color: #d4af37; font-weight: bold; display: block; margin-bottom: 6px; }
        textarea { 
            width: 100%; 
            height: 120px; 
            background: #0d0a08; 
            color: #00ff66; 
            font-family: monospace; 
            border: 1px solid #5c4028; 
            border-radius: 6px; 
            padding: 12px; 
            font-size: 0.9rem; 
            margin-bottom: 18px; 
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #d4af37; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select, button { 
            padding: 12px 16px; 
            border-radius: 6px; 
            border: none; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
        }
        select { 
            background: #3d2e21; 
            color: #f4e8c1; 
            border: 1px solid #8b5a2b; 
            flex: 1; 
            min-width: 180px;
        }
        button { 
            background: #8b0000; 
            color: #fff; 
            border: 1px solid #d4af37; 
            flex: 2; 
            min-width: 180px;
            transition: all 0.2s ease; 
        }
        button:hover { background: #a52a2a; transform: translateY(-1px); }
        button:disabled { background: #555; cursor: not-allowed; }
        .output { 
            margin-top: 20px; 
            padding: 20px; 
            background: #0d0a08; 
            border-left: 4px solid #d4af37; 
            border-radius: 4px; 
            font-style: italic; 
            display: none; 
            line-height: 1.6; 
            color: #f4e8c1; 
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ye Olde Stack Trace 🏴‍☠️⚔️</h1>
        <p>Turn scary error logs and stack traces into high-seas pirate lore or medieval court ballads!</p>

        <label for="errorInput">PASTE YOUR ERROR LOG HERE:</label>
        <textarea id="errorInput" placeholder="e.g. 500 Internal Server Error: NullPointerException at line 42"></textarea>

        <div class="controls">
            <select id="modeSelect">
                <option value="pirate">🏴‍☠️ High Seas Pirate</option>
                <option value="medieval">⚔️ Medieval Bard</option>
            </select>
            <button id="submitBtn" onclick="translateError()">Translate Error!</button>
        </div>

        <div id="outputBox" class="output"></div>
    </div>

    <script>
        const LAMBDA_URL = 'https://2774lz4llatdrn3rzctsonkjsu0eeybs.lambda-url.ap-southeast-2.on.aws/';

        async function translateError() {
            const error = document.getElementById('errorInput').value;
            const mode = document.getElementById('modeSelect').value;
            const outputBox = document.getElementById('outputBox');
            const submitBtn = document.getElementById('submitBtn');

            if (!error.trim()) {
                alert('Ahoy! Paste an error log first!');
                return;
            }

            submitBtn.disabled = true;
            outputBox.style.display = 'block';
            outputBox.innerText = mode === 'pirate' ? '🏴‍☠️ Deciphering ship logs...' : '⚔️ Consulting the royal scrolls...';

            try {
                const res = await fetch(LAMBDA_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ error: error, mode: mode })
                });

                const data = await res.json();

                if (data.translation) {
                    outputBox.innerText = data.translation;
                } else {
                    outputBox.innerText = '⚠️ Failed to translate the error log. Check your backend response.';
                }
            } catch (err) {
                console.error(err);
                outputBox.innerText = '💥 Arrr! Cannon misfire! Could not reach AWS Lambda. Make sure CORS is enabled on your Function URL.';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
